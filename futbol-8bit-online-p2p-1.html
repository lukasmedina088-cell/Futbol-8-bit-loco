<style>

*{box-sizing:border-box}

#banner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:clamp(18px,7vw,36px);color:#ffd60a;text-shadow:4px 4px 0 #000;pointer-events:none;text-align:center;padding:0 8px}

@keyframes rplblink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){#rpl .rec{animation:none}}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
#ctl{display:none;justify-content:space-between;align-items:center;margin-top:14px;padding:0 6px}
#joy{width:130px;height:130px;border:4px solid var(--ink);border-radius:50%;background:var(--panel);position:relative;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;background:var(--p1);border:3px solid var(--ink);border-radius:50%}
#btns{display:grid;grid-template-columns:repeat(3,auto);gap:8px}
#btns button{font-family:inherit;font-size:9px;width:70px;height:70px;border-radius:50%;border:4px solid var(--ink);background:var(--ok);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.55);touch-action:none;line-height:1.5}
#btns button#bB{background:var(--p1)}
#btns button#bC{background:var(--p2)}
#btns button#bD{background:#ff7b00}
#btns button#bE{background:#8e44ad}#btns button#bF{background:#009688}

@media (max-width:480px){#joy{width:110px;height:110px}#btns button{width:60px;height:60px;font-size:8px}}
.hint{text-align:center;font-size:7px;line-height:2;margin-top:12px;opacity:.75}
#ov{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;background:var(--bg);text-align:center}
#ov h1{font-size:clamp(18px,6vw,26px);margin:0;line-height:1.4}
#ov p{margin:0;font-size:8px;line-height:2;max-width:420px}
.btn{font-family:inherit;font-size:11px;padding:13px 16px;background:var(--ok);color:#fff;border:3px solid var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.55);cursor:pointer}
.btn.b{background:var(--p2)}.big{font-size:32px}
@media (prefers-reduced-motion:reduce){#banner.show{animation:none}}
.who{display:block;font-size:7px;color:var(--ink);opacity:.7;margin-top:3px}
#ov{overflow-y:auto;justify-content:center;justify-content:safe center}
.lb{font-size:8px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;max-width:420px}
.tm{font-family:inherit;font-size:7px;line-height:1.4;padding:9px 4px;background:var(--panel);color:var(--ink);border:3px solid var(--ink);cursor:pointer}
.tm.on{background:var(--ok);color:#fff}
.tm i{display:inline-block;width:9px;height:9px;border:3px solid;margin-right:4px;vertical-align:middle}
.inf{font-size:7px;line-height:1.8;min-height:14px;opacity:.85}
details{max-width:420px}summary{cursor:pointer;font-size:8px;padding:6px}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes spop{0%{transform:scale(1)}40%{transform:scale(1.7);color:#ffd60a}100%{transform:scale(1)}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg) scale(1.06)}75%{transform:rotate(3deg) scale(1.06)}}
#ov{animation:fadein .35s steps(5)}
#ov .big{animation:bob 1s steps(4) infinite}
.btn,.tm{transition:transform .08s steps(2)}
.btn:hover,.tm:hover{transform:translateY(-2px)}
.btn:active,.tm:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.55)}
.sc.pop{animation:spop .5s steps(6)}
#banner.show{animation:pop .35s steps(4),wob 1.2s steps(6) .35s 2}

.tm.lg{grid-column:1/-1;font-size:8px;margin-top:6px;background:var(--ink);color:var(--bg)}.tm.lg.on{background:var(--ok);color:#fff}

#ctl,#btns button,#joy{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mid .bt{display:flex;gap:3px}

/* Interfaz renovada: selección clara por ligas y tarjetas de clubes */
#ov{background:linear-gradient(145deg,var(--bg),color-mix(in srgb,var(--panel) 72%,var(--bg)));gap:12px;padding:clamp(14px,3vw,26px)}
#ov h1{letter-spacing:1px;text-shadow:3px 3px 0 color-mix(in srgb,var(--ink) 18%,transparent)}
#ov .lb{font-size:9px;letter-spacing:.5px;margin-top:8px;color:var(--ink);opacity:1}
#ov .grid{max-width:600px;gap:7px}
#ov .grid:has(.tm){padding:7px;background:color-mix(in srgb,var(--ink) 7%,transparent);border:2px solid color-mix(in srgb,var(--ink) 22%,transparent);border-radius:10px}
#ov .tm{border:2px solid color-mix(in srgb,var(--ink) 32%,transparent);border-radius:7px;min-height:38px;padding:8px 5px;font-size:7px;box-shadow:0 3px 0 color-mix(in srgb,var(--ink) 20%,transparent);overflow-wrap:anywhere}
#ov .tm.on{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok),0 3px 0 color-mix(in srgb,var(--ink) 20%,transparent);transform:translateY(-1px)}
#ov .tm i{width:12px;height:12px;border-width:3px}
#ov .inf{background:var(--panel);border:2px solid color-mix(in srgb,var(--ink) 20%,transparent);border-radius:8px;padding:7px 10px;max-width:600px;width:100%;font-size:8px}
#ov .btn{border-radius:8px;max-width:600px;width:100%;padding:13px 12px;line-height:1.8}
#ov details{width:100%;max-width:600px;background:var(--panel);border:2px solid color-mix(in srgb,var(--ink) 20%,transparent);border-radius:8px;padding:6px 10px}
#ov details p{font-size:8px}
#ov .big svg{width:44px;height:44px;display:inline-block}
#ov .big{filter:drop-shadow(3px 3px 0 color-mix(in srgb,var(--ink) 20%,transparent))}

#ov .tm.club-chip{display:flex;align-items:center;justify-content:flex-start;gap:7px;text-align:left;min-height:48px;padding:6px 8px}
#ov .tm.club-chip .crest{background:transparent}
#ov .tm.club-chip .crest.img{image-rendering:auto}
#ov .tm.club-chip .crest{width:32px;height:32px;flex:0 0 32px;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}
#ov .tm.club-chip .club-fallback{width:14px;height:14px;flex:0 0 14px;border:3px solid;display:inline-block;border-radius:3px}
#ov .flag{width:24px;height:17px;image-rendering:pixelated;vertical-align:middle;margin-right:3px;box-shadow:0 0 0 1px #000}
#ov .tm.club-chip span{overflow-wrap:anywhere}

@media(min-width:560px){#ov .grid{grid-template-columns:repeat(4,minmax(0,1fr))}#ov .grid#l0,#ov .grid#l1{grid-template-columns:repeat(5,minmax(0,1fr))}}

.tcv{width:min(300px,80vw);max-height:42vh;object-fit:contain;image-rendering:pixelated}

/* tablero de tácticas */
.tb{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:10px;width:100%;max-width:820px}
.tb-l{flex:0 1 190px;display:flex;flex-direction:column;gap:6px;text-align:left}
.tb-fm,.tb-fc{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tb-fc{grid-template-columns:1fr}
#ov .tb .tm{min-height:0;padding:7px 3px;font-size:7px;text-align:center}
.tb-pitch{position:relative;flex:0 0 auto;touch-action:none;user-select:none;-webkit-user-select:none;border:3px solid #fff;border-radius:6px;overflow:hidden;
 background:repeating-linear-gradient(0deg,#35a046 0 12.5%,#2c8a3b 12.5% 25%)}
.tb-pitch .ln{position:absolute;border:2px solid rgba(255,255,255,.75);pointer-events:none}
.tk{position:absolute;width:15%;aspect-ratio:14/13;transform:translate(-50%,-50%);cursor:grab;transition:left .28s steps(5),top .28s steps(5);touch-action:none;color:var(--n)}
.tk svg{display:block;width:100%;height:100%}
.tk b{position:absolute;left:0;right:0;top:36%;text-align:center;font-family:inherit;font-size:clamp(6px,1.9vw,9px);line-height:1;pointer-events:none}
.tk u{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:6px;text-decoration:none;color:#fff;text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000;white-space:nowrap;pointer-events:none;margin-top:1px}
.tk.dg{transition:none;cursor:grabbing;z-index:3}
.tk.dg svg{transform:scale(1.15)}
.tk.sel{z-index:2}
.tk.sel svg{filter:drop-shadow(2px 0 0 #ffd60a) drop-shadow(-2px 0 0 #ffd60a) drop-shadow(0 2px 0 #ffd60a) drop-shadow(0 -2px 0 #ffd60a)}
.tb-st{flex:1 1 150px;min-width:140px;max-width:240px;background:var(--panel);border:2px solid color-mix(in srgb,var(--ink) 25%,transparent);border-radius:8px;padding:10px;text-align:left;font-size:8px;line-height:1.7}
.tb-st h3{margin:0 0 4px;font-size:10px;line-height:1.4}
.tb-st .pos{opacity:.8;margin-bottom:6px}
.sb{position:relative;margin:6px 0;padding-bottom:7px}
.sb span{display:inline-block}.sb b{float:right}
.sb i{position:absolute;left:0;bottom:0;height:4px;background:var(--ok);border-radius:2px}
.sb:after{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;background:color-mix(in srgb,var(--ink) 18%,transparent);border-radius:2px;z-index:-1}
.tb-bt{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

#joy{--n:10px}#knob{--n:8px}#btns button{--n:8px}.tb-pitch{--n:6px}

  const pr=P.filter(e=>e.t!==p.t&&dist(e,p)<48).length,pr2=P.filter(e=>e.t!==p.t&&dist(e,{x:tx,y:ty})<36).length;
  const A=2.5+pr*5+pr2*4;
  ball.rdel=5+Math.floor(Math.random()*12);
  ball.rsp=.8+Math.random()*.22;
  return[clamp(tx+(Math.random()-.5)*2*A,PL+12,PR-12),clamp(ty+(Math.random()-.5)*2*A,PT+6,PB-6)];
}
/* el receptor corre hacia donde va la pelota; con demora, velocidad variable y leve oscilación.

function recvRun(p,r,hum){

  if(ball.rdel>0){ball.rdel--;return}
  const dx=ball.tx-p.x,dy=ball.ty-p.y,d=Math.hypot(dx,dy);
  if(d<5)return;

  else{r.dx=ux;r.dy=uy;r.sp=sp}
}
function pass(p){
  let best=null,bs=-1e9;
  for(const q of P)if(q.t===p.t&&q!==p){
    const d=dist(p,q);if(d<14)continue;
    if(p.i&&d>420)continue;
    let s;
    if(p.ko){if(!q.i||(p.x-q.x)*(p.t?-1:1)<60)continue;s=-Math.abs(q.y-CY)-d*.1}
    else if(p.i===0){
      if(q.i===0)continue;
      let pen=0;for(const e of P)if(e.t!==p.t&&dist(e,q)<24)pen=60;
      s=-d-pen-((p.x-q.x)*(p.t?-1:1)>0?120:0)+(G.hum[p.t]&&ctl[p.t]===p?((q.x-p.x)*p.dx+(q.y-p.y)*p.dy)/d*90:0);
    }else if(G.hum[p.t]&&ctl[p.t]===p)s=((q.x-p.x)*p.dx+(q.y-p.y)*p.dy)/d*60-d*.12-(q.i?0:200);
    else s=clamp(openness(q),0,150)*.5+(q.x-p.x)*(p.t?-1:1)*.25-Math.abs(d-150)*.2-(q.i?0:200);
    if(s>bs){bs=s;best=q}
  }
  if(!best)return false;
  let[tx,ty]=passAim(p,clamp(best.x+best.dx*16,PL+16,PR-16),clamp(best.y,PT+8,PB-8));
  const d=Math.hypot(tx-p.x,ty-p.y)||1,sp=clamp(3.4+d*.015,3.6,8.5)*(ball.rsp||1);
  ball.vx=(tx-p.x)/d*sp;ball.vy=(ty-p.y)/d*sp;ball.own=null;ball.lock=8;ball.recv=best;ball.last=p;p.ko=false;ball.tx=tx;ball.ty=ty;ball.thru=false;p.kk=8;
  if(G.hum[p.t]&&best.i>0){ctl[p.t]=best;sw[p.t]=40}
  passStart(p.t);sfx('pass');return true;
}
function pass2(p,kind){
  const att=p.t?-1:1,lob=kind==='lob';let best=null,bs=-1e9;
  for(const q of P){
    if(q.t!==p.t||q===p||!q.i)continue;
    const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy)||1;let s;
    if(lob){if(d<110||d>440)continue;s=(dx*p.dx+dy*p.dy)/d*70+d*.08}
    else{if(d<50||d>280)continue;s=(dx*p.dx+dy*p.dy)/d*50+openness(q)*.35+dx*att*.1-d*.05}
    if(s>bs){bs=s;best=q}
  }
  if(!best)return false;
  let tx,ty;
  if(lob){tx=best.x+best.dx*20;ty=best.y+best.dy*10}
  else{const fwd=(best.x-p.x)*att>0;tx=fwd?best.x+att*(45+dist(p,best)*.12):best.x+(best.dx||0)*40;ty=best.y+best.dy*14}
  tx=clamp(tx,PL+12,PR-12);ty=clamp(ty,PT+6,PB-6);
  [tx,ty]=passAim(p,tx,ty);
  const ox=ball.x,oy=ball.y,d=Math.hypot(tx-ox,ty-oy)||1;
  if(lob){
    const vz=clamp(2.2+d*.006,2.6,5),T=2*vz/GRV;
    ball.vx=(tx-ox)/T;ball.vy=(ty-oy)/T;ball.vz=vz;ball.z=1;ball.lock=10;
  }else{
    const sp=clamp(3+d*.015,4,6.8);
    ball.vx=(tx-ox)/d*sp;ball.vy=(ty-oy)/d*sp;ball.lock=8;
  }
  ball.own=null;ball.recv=best;ball.last=p;ball.pw=false;ball.shot=false;ball.thru=!lob;ball.tx=tx;ball.ty=ty;p.ko=false;p.kk=8;passStart(p.t);
  if(G.hum[p.t]){ctl[p.t]=best;sw[p.t]=40}
  sfx(lob?'lob':'thru');
  return true;
}
/* ---------- Pelota en el aire: elevar, cabezazo, volea y chilena ---------- */
function liftBall(p){
  const d=Math.hypot(p.dx,p.dy)||1;
  ball.own=null;ball.recv=p;ball.last=p;ball.lock=5;
  ball.vx=p.dx/d*.7;ball.vy=p.dy/d*.7;ball.vz=3.1;ball.z=2;ball.chil=null;
  ball.pw=false;ball.shot=false;ball.thru=false;ball.cn=0;ball.curve=0;ball.pass=null;ball.gkd=0;
  p.hold=0;p.kk=6;if(G.hum[p.t]){ctl[p.t]=p;sw[p.t]=90}
  sfx('lob');puff(ball.x,ball.y,4,'#d8e8c0',.8);
}
function airOk(p,k){
  if(G.state!=='play'||ball.own||ball.lock>0||p.i===0||p.stun>0||p.down||p.dive>0||p.lunge>0||p.spin>0||p.fm>0||p.aircd>0||p.hf>0||p.gu>0||p.ko)return false;
  const z=ball.z,d=dist(p,ball);
  if(k==='volley')return d<17&&z>=4&&z<=24;
  if(k==='head')return d<17&&z>=15&&z<=40;

}
function aerial(p,k){

  ball.own=null;ball.recv=null;ball.last=p;ball.lock=10;ball.cn=0;ball.curve=0;ball.thru=false;ball.pass=null;ball.gkd=0;
  if(k==='head'&&dg>170){
    /* cabezazo de pase: arco corto hacia un compañero (o hacia donde mira) */
    let best=null,bs=-1e9;
    for(const q of P)if(q.t===t&&q!==p&&q.i>0){
      const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy)||1;if(d<35||d>280)continue;
      const s=hum?(dx*p.dx+dy*p.dy)/d*70-d*.1+dx*att*.05:dx*att*.2-d*.1;
      if(s>bs){bs=s;best=q}
    }
    const tx=clamp(best?best.x+best.dx*14:p.x+(p.dx||att)*110,PL+14,PR-14),ty=clamp(best?best.y:p.y+p.dy*110,PT+6,PB-6);

    ball.vx=(tx-ball.x)/T;ball.vy=(ty-ball.y)/T;ball.vz=vz;
    ball.recv=best;ball.pw=false;ball.shot=false;ball.tx=tx;ball.ty=ty;
    if(best){passStart(t);if(hum){ctl[t]=best;sw[t]=40}}
    p.ad=ball.vx>=0?1:-1;sfx('pass');puff(ball.x,ball.y-z0*.6,4,'#ffffff',.8);
    return true;

  const bic=k==='bicycle',sp=(bic?13.2:k==='volley'?10:7.6)*(.92+shr*.1);
  const aim=hum?(p.dy?GC+p.dy*26:GC+(Math.random()-.5)*24):GC+(Math.random()<.5?-1:1)*(6+Math.random()*16);
  const ty=aim+(Math.random()-.5)*((1-shr)*(bic?44:k==='volley'?34:26)+4);
  const dx=gx-ball.x,dy=ty-ball.y,d=Math.hypot(dx,dy)||1,n=Math.max(4,Math.round(d/sp)),zt=3+Math.random()*13;

  ball.pw=bic;ball.shot=true;ball.sd=d;ball.curve=k==='volley'?1:0;ball.gkd=0;
  {const q=shootSim(ball.x,ball.y,Math.atan2(dy,dx),sp,ball.vz,0,0,gx);if(q&&q[0]>GY0&&q[0]<GY1)ST[t]++}
  p.ad=ball.vx>=0?1:-1;
  if(bic){
    const nch=G.chT[t]=(G.chT[t]||0)+1;
    ball.chil=p;ball.chilF=G.frame;G.slow=Math.max(G.slow||0,80);
    sfx('power');sfx('slow');swell(.18);shake=Math.max(shake,4);puff(ball.x,ball.y-z0*.6,12,'#d8e8c0',1.4);
    say('¡CHILENA!'+(G.hum[t]?' '+nch+'/3':''),'#ffd60a');G.bt=70;
  }
  else{sfx('kick');puff(ball.x,ball.y-z0*.6,6,'#d8e8c0',1.1)}

function steal(p){
  if(G.state!=='play')return false;
  const v=ball.own;
  if(!v||v.t===p.t||v.i===0||dist(v,p)>12){
    /* barrida a un rival que no tiene la pelota: falta, salvo que toques el balón suelto */
    if(!v&&dist(p,ball)<14)return false;
    for(const e of P)if(e.t!==p.t&&!e.down&&dist(e,p)<9){if(Math.random()<.55){foul(p,e);return true}return false}
    return false;
  }
  if(v.i===0||dist(v,p)>12)return false;
  if(v.ko)return false;
  if(v.spin>0||v.fm>0){p.stun=24;return true}
  const behind=((p.x-v.x)*v.dx+(p.y-v.y)*v.dy)<0,win=Math.random()<(v.shield?.3:.6);
  if(Math.random()<(win?(behind?.3:.12):(behind?.75:.45))){foul(p,v);return true}
  if(win){ball.own=p;p.hold=0;v.stun=28;ball.lock=6;sfx('tackle');if(Math.random()<.04)injure(v)}
  else{p.stun=18;if(Math.random()<.05)injure(p)}
  return true;
}

/* ---------- IA ---------- */
function predY(gl){
  let x=ball.x,y=ball.y,vx=ball.vx,vy=ball.vy,z=ball.z,vz=ball.vz,n=ball.cn,w=ball.cw||0;const sg=gl>x?1:-1;
  for(let i=0;i<300;i++){
    x+=vx;y+=vy;
    if(n>0){n--;const c=Math.cos(w),s=Math.sin(w),t=vx*c-vy*s;vy=vx*s+vy*c;vx=t}
    if(z>0||vz>0){vz-=GRV;z+=vz;if(z<=0){z=0;vz=0;vx*=.85;vy*=.85}}else{vx*=.985;vy*=.985}
    if(y<PT){y=PT;vy=Math.abs(vy)}if(y>PB){y=PB;vy=-Math.abs(vy)}
    if((x-gl)*sg>=0)return[y,i];
  }
  return null;
}
function wallSpot(w){const f=G.fk,n=f.wall.length,dir=Math.sign((f.t?PL:PR)-f.x)||1,off=(w-(n-1)/2)*9;return{x:clamp(f.x+dir*62,PL+8,PR-8),y:clamp(f.y+off,PT+6,PB-6)}}
function ai(p){
  const t=p.t,att=t?-1:1,gx=t?PL:PR,o=ball.own,r={dx:0,dy:0,a:0,b:0,c:0,d:0,e:0,f:0,sp:.95},F=(G.fo&&G.fo[t])||FOC.eq;

  if(G.fk&&G.fk.wall&&G.fk.wall.includes(p)&&G.fk.taker&&G.fk.taker.t!==t){const w=wallSpot(G.fk.wall.indexOf(p));go(w.x,w.y,1);return r}
  const kt=koTaker();if(kt&&p!==kt){go(p.hx,p.hy,.8);return r}
  if(p.i===0){
    const gl=t?PR:PL,bsp=Math.hypot(ball.vx,ball.vy),cur=ball.cn>0||(ball.curve&&ball.shot),pr=(!o&&cur&&ball.vx*(t?1:-1)>0&&Math.abs(ball.x-gl)<420)?predY(gl):null;
    if(!o&&!p.dive&&!p.dcd&&!(p.dr>8)&&(cur||ball.z<18)&&bsp>(cur?5.2:3.8)&&ball.vx*(t?1:-1)>0&&Math.abs(ball.x-gl)<(cur?420:260)&&(cur||ball.shot||bsp>5)){
      let ty=ball.y+ball.vy*(Math.abs(ball.x-gl)/Math.abs(ball.vx)),ti=Math.abs(ball.x-gl)/Math.max(.1,Math.abs(ball.vx));if(pr){ty=pr[0];ti=pr[1]}
      const need=Math.abs(ty-p.y),D=clamp(10+Math.round(need/3.2),12,24);
      /* se tira cuando el tiro va al arco y no llega caminando; siempre hacia el lado correcto (si falla, se queda corto) */
      if(ti<=Math.min(cur?30:38,D+6)&&ty>GY0-6&&ty<GY1+6&&need>9){
        const ez=cur?clamp(((ball.sd||300)-130)/260,0,1):0,sl=!cur&&bsp<6.3&&!ball.pw?.22+.78*clamp(((ball.sd||250)-120)/330,0,1):1,ok=Math.random()<clamp(((p.sv||.7)+(cur?.12+ez*.22-(1-ez)*.2:0))*sl,0,.95),sg=Math.sign(ty-p.y)||1;
        p.dty=clamp(ok?ty+(Math.random()-.5)*8:ty-sg*(18+Math.random()*12),GY0-4,GY1+4);
        startDive(p,sg);

      p.gtx+=(x-p.gtx)*.12;p.gty+=(y-p.gty)*.12;

/* ---------- Actualización ---------- */
function regate(p,mv,r){
  let ax=r.dx,ay=r.dy;if(!(ax||ay)){ax=p.dx;ay=p.dy}
  let q=null,qd=1e9;for(const e of P)if(e.t!==p.t){const d=dist(p,e);if(d<qd){qd=d;q=e}}
  const cr=q?p.dx*(q.y-p.y)-p.dy*(q.x-p.x):0;
  p.cd2=80;
  if(mv===2){
    p.sa=Math.atan2(ay,ax);p.ss=cr?(cr>0?-1:1):1;
    p.spin=24;sfx('spin');
    for(const e of P)if(e.t!==p.t&&dist(p,e)<34){e.stun=Math.max(e.stun,54);e.lunge=0}
  }else if(mv===1){
    p.fs=cr>0?-1:cr<0?1:(Math.random()<.5?-1:1);
    p.fnx=-p.dy;p.fny=p.dx;p.fdx=p.dx;p.fdy=p.dy;
    p.fm=22;sfx('feint');
  }else{
    const m=Math.hypot(ax,ay)||1,ux=ax/m,uy=ay/m,D=70;
    const tx=clamp(p.x+ux*D,PL+12,PR-12),ty=clamp(p.y+uy*D,PT+6,PB-6);
    const vz=2.6,T=2*vz/GRV,ox=ball.x,oy=ball.y;

function stepPlayer(p){

  if(p.aircd>0)p.aircd--;
  if(p.dr>0)p.dr--;

  if(p.hf>0){p.hf--;if(p.hf===HF-3){puff(p.x+(p.ad||1)*6,p.y,7,'#d8c892',1.1);sfx('thud')}p.chg=0;p.rw=0;p.rt=0;p.fm=0;p.mvh=0;return}
  if(p.gu>0){p.gu--;p.chg=0;p.rw=0;p.rt=0;p.fm=0;p.mvh=0;return}

  }

    /* balón parado: el que cobra no se mueve; apunta con la dirección y tira (B / D) o pasa */
    if(G.fk.kind)spTake(p,r,hum);

      p.dx=p.t?-1:1;if(hum)p.dy=r.dy*.9;

  /* golpes aéreos: A = cabezazo · B = volea · D = chilena (solo con la pelota en el aire, a tu alcance) */

    const want=hum?(r.a?'head':r.b?'volley':r.d?'bicycle':null):null;
    if(want&&airOk(p,want)){aerial(p,want);r.a=r.b=r.d=0}
    else if(!hum&&!p.aircd&&ball.z>3&&dist(p,ball)<17&&Math.random()<.1){
      const ks=['head','volley','bicycle'].filter(k=>airOk(p,k)&&(k==='volley'?Math.abs((p.t?PL:PR)-p.x)<230:(k!=='bicycle'||Math.abs((p.t?PL:PR)-p.x)<350)));
      if(ks.length)aerial(p,ks[Math.floor(Math.random()*ks.length)]);
    }
  }
  if(r.d&&o){
    const tp=TAP[p.t];
    if(tp.cd<=0){tp.cd=600;r.b=1;r.pw=1}
  }
  if(hum&&o&&r.b&&!r.pw){p.chg=Math.max(p.chg,1);r.b=0}
  if(p.chg>0){
    if(!hum||!o)p.chg=0;
    else if(INP[p.t].bh)p.chg=Math.min(60,p.chg+1);
    else{
      const iy=INP[p.t].y,cv=p.chg/60,sy=Math.abs(iy)>.3?Math.sign(iy):(p.y<GC?1:-1);
      const isfk=!!(G.fk&&G.fk.taker===p&&!G.fk.pen&&!G.fk.kind),ty=isfk&&cv>.15&&Math.abs(iy)>.3?GC+Math.sign(iy)*27:(p.dy?GC+p.dy*26:GC+(Math.random()-.5)*24);

  }
  if(r.b){

    }else if(hum){

  if(p.rw>0){

  }
  if(mv&&o&&!p.cd2&&!p.spin&&!p.fm)regate(p,mv,r);
  if(hum&&!o&&!p.ko&&INP[p.t].bh&&ball.own&&ball.own.t!==p.t&&!p.lunge&&!p.dive&&G.state==='play'){
    const v=ball.own,d=dist(p,v);

    r.sp=1.1;
    if(d<16){if(++p.pt>20&&Math.random()<.04)pressSteal(p)}else p.pt=0;
  }
  let dx=r.dx,dy=r.dy,sp=r.sp;
  if(p.dive>0){
    p.dive--;const DD=p.dD||20,pg=1-p.dive/DD;
    if(p.dm!=null)p.y=clamp(p.dy0+p.dm*(1-(1-pg)*(1-pg)),16,PB);

  }

  else if(p.fm>0){
    p.fm--;
    if(p.fm>12){dx=-p.fnx*p.fs;dy=-p.fny*p.fs;sp=2.2}
    else{
      const vx=p.fnx*p.fs+p.fdx*.6,vy=p.fny*p.fs+p.fdy*.6,m=Math.hypot(vx,vy)||1;
      dx=vx/m;dy=vy/m;sp=3;p.dx=dx;p.dy=dy;
      if(p.fm===12)for(const e of P)if(e.t!==p.t&&dist(p,e)<34){e.stun=Math.max(e.stun,34);e.lunge=0}
    }
  }
  else if(p.lunge>0){p.lunge--;if(p.lunge%3===0)puff(p.x,p.y,3,'#d8c892',1.2);dx=p.dx;dy=p.dy;sp=2.4;if(steal(p))p.lunge=0}
  else{const m=Math.hypot(dx,dy);if(m>.05){dx/=m;dy/=m;p.dx=dx;p.dy=dy}else dx=dy=0;sp*=SPD*p.spd*(p.boost>0?1.25:1)*(p.dr>0?.6:1)*pmul(p)}
  if(p.i===0&&ball.own!==p&&!p.dive&&!p.down){p.dx=p.t?-1:1;p.dy=0}
  if(p.at>0){p.at--;if(p.air==='bicycle'){dx=dy=0}else sp*=.5;if(p.at===0&&p.air==='head')p.hf=HF}
  if(ball.own===p)sp*=.9;
  if(dx||dy){p.run++;p.mvh=3}else if(p.mvh>0)p.mvh--;
  if(p.kk>0)p.kk--;
  if((dx||dy)&&sp>1.25&&p.run%9===0)puff(p.x,p.y,2,'#b9a36b',.6);
  if(p.boost>0&&(dx||dy)&&p.run%4===0)puff(p.x,p.y,2,'#ffd60a',.8);
  const lim=p.i?[10,W-10]:(p.t?[W-110,W-10]:[10,110]);
  p.x=clamp(p.x+dx*sp,lim[0],lim[1]);p.y=clamp(p.y+dy*sp,16,PB);
  const fk=G.fk;
  if(fk&&p!==fk.taker&&p.i>0){

    else if(p.t!==fk.t){if(fk.kind==='gk'&&inBox(fk.t,p.x,p.y))p.x=fk.t?PR-96:PL+96;const rr=fk.rad===undefined?46:fk.rad,ex=p.x-fk.x,ey=p.y-fk.y,ed=Math.hypot(ex,ey)||1;if(rr&&ed<rr){p.x=fk.x+ex/ed*rr;p.y=clamp(fk.y+ey/ed*rr,16,PB)}}
  }
  const kt=koTaker();

    if(p.t!==kt.t){const ex=p.x-CX,ey=p.y-CY,ed=Math.hypot(ex,ey)||1;if(ed<40){p.x=CX+ex/ed*40;p.y=CY+ey/ed*40}}
  }
}
/* velocidad del jugador que controlás: R2 corre, sin R2 va un poco más lento, L2 con la pelota la protege */
function pmul(p){
  if(!(G.hum[p.t]&&ctl[p.t]===p))return 1;
  const I=INP[p.t];
  if(I.sh&&ball.own===p)return .6;
  if(I.run)return 1.3;
  return .9;
}
function pickup(){
  if(ball.own||ball.lock>0)return;
  if(gkCurve())return;
  if(ball.z>18)return;
  const sp=Math.hypot(ball.vx,ball.vy);
  // Colisión barrida: comprobar el segmento recorrido por la pelota, no solo su posición final.
  // Así se pueden cortar pases rápidos colocándose en la línea de pase.
  if(ball.px!=null && ball.py!=null && sp>2.2 && ball.z<7){
    const ax=ball.px,ay=ball.py,bx=ball.x,by=ball.y,dx=bx-ax,dy=by-ay,len2=dx*dx+dy*dy;
    let best=null,bestD=1e9;
    for(const p of P){
      if(p.i===0||p.stun>0||p.hf>0||p.ko||p.t===(ball.last&&ball.last.t))continue;
      const u=len2?clamp(((p.x-ax)*dx+(p.y-ay)*dy)/len2,0,1):0;
      const qx=ax+u*dx,qy=ay+u*dy,d=Math.hypot(p.x-qx,p.y-qy);
      if(d<8.5 && d<bestD){best=p;bestD=d}
    }
    if(best){
      ball.x=clamp(best.x,PL+2,PR-2);ball.y=clamp(best.y,PT+2,PB-2);
      ball.own=best;ball.recv=null;ball.last=best;ball.vx=ball.vy=0;ball.vz=0;ball.z=0;ball.pw=false;ball.shot=false;ball.thru=false;best.hold=0;best.pt=0;
      best.puff=4;sfx('tackle');swell(.08);return;
    }
  }
  for(const p of [ball.recv,...P]){
    if(!p||p.stun||p.hf>0)continue;
    const gd=p.i===0&&(p.dive>0||p.dr>6);
    if(ball.z>(gd?18:8))continue;
    if(p.i===0&&ball.curve&&ball.gkd)continue;
    if(p.i===0&&!gd&&sp>=6.5&&ball.z<12&&ball.last&&ball.last.t!==p.t&&dist(p,ball)<11){
      if(Math.random()<.45){
        const sg=p.t?-1:1;
        ball.vx=sg*(2+Math.random()*3);ball.vy=(Math.random()-.5)*6;ball.lock=14;ball.cn=0;ball.pw=false;ball.shot=false;
        ball.z=0;ball.vz=0;ball.recv=null;ball.last=p;sfx('tackle');swell(.12);
      }else{ball.pw=false;ball.own=p;ball.recv=null;p.hold=0}
      return;
    }
    if(dist(p,ball)<(gd?16:(p.i?7:10))&&sp<(gd?14:(p.i?(p===ball.recv&&ball.thru?5.4:4.6):6.5))){
      if(gd&&sp>6.5&&Math.random()<.45){
        ball.vx=Math.abs(ball.vx)*(p.t?-.5:.5);ball.vy=(Math.random()-.5)*5;
        ball.lock=14;ball.cn=0;ball.pw=false;ball.recv=null;ball.last=p;endDive(p);sfx('tackle');swell(.12);return;
      }
      ball.pw=false;ball.own=p;ball.recv=null;p.hold=0;return}
  }
}
/* ---------- Atajadas de tiros con curva ---------- */
/* De lejos (>=390) la curva es muy atajable; de cerca (<=130) es difícil, casi como el tiro potente. */
function gkCurve(){
  if(!(ball.shot&&ball.curve)||!ball.last||ball.gkd)return false;
  for(const g of P){
    if(g.i!==0||g.t===ball.last.t||g.stun>0||g.down)continue;
    if(ball.vx*(g.t?1:-1)<=0)continue;
    const dv=g.dive>0||g.dr>6;
    if(ball.z>(dv?34:28)||dist(g,ball)>(dv?18:11))continue;
    ball.gkd=1;
    const ez=clamp(((ball.sd||300)-130)/260,0,1),pc=clamp(.14+.7*ez+((g.sv||.7)-.75)*.5,.08,.95),pp=.25+.35*ez,r=Math.random();
    if(r<pc){
      ball.own=g;ball.recv=null;ball.last=g;ball.vx=ball.vy=0;ball.vz=0;ball.z=0;ball.pw=false;ball.shot=false;ball.curve=0;ball.cn=0;g.hold=0;sfx('tackle');swell(.12);return true;
    }
    if(r<pc+(1-pc)*pp){
      const sg=g.t?-1:1;
      ball.vx=sg*(2+Math.random()*3);ball.vy=(Math.random()-.5)*6;ball.lock=14;ball.cn=0;ball.pw=false;ball.shot=false;ball.curve=0;ball.z=0;ball.vz=0;ball.recv=null;ball.last=g;sfx('tackle');swell(.12);return true;
    }
    return false;
  }
  return false;
}

/* ---------- Palos, travesaño y balón parado (córner, saque de arco, saque de banda) ---------- */
const BARZ=25,BARH=4.5,POSTR=4;
function lobBall(p,tx,ty,rc){

function spLob(p){
  const fk=G.fk,cor=fk.kind==='corner',att=p.t?-1:1;let best=null,bs=-1e9;
  for(const q of P){

    if(d<90||(!cor&&d>460))continue;

    else{s+=d*.08;for(const e of P)if(e.t!==p.t&&dist(e,q)<26){s-=45;break}}
    if(s>bs){bs=s;best=q}
  }

  if(best){tx=best.x+best.dx*18;ty=best.y+best.dy*8}
  else if(cor){tx=p.t?PL+60:PR-60;ty=CY+(Math.random()-.5)*70}
  else{tx=p.x+att*320;ty=CY+(Math.random()-.5)*260}

function spTake(p,r,hum){
  const fk=G.fk,kd=fk.kind,att=p.t?-1:1;let ax,ay;
  if(hum&&(r.dx||r.dy)){ax=r.dx;ay=r.dy}
  else if(kd==='throw'){ax=att*.45;ay=p.y<CY?.9:-.9}
  else if(kd==='corner'){ax=-att*.8;ay=p.y<CY?.6:-.6}
  else{ax=att;ay=0}
  const m=Math.hypot(ax,ay)||1;p.dx=ax/m;p.dy=ay/m;
  r.dx=r.dy=0;r.c=0;r.mv=0;
  if(!hum){
    r.a=r.b=r.d=r.e=r.f=0;r.pw=0;
    if(p.hold>fk.wait){if(kd==='throw'||(kd==='gk'&&fk.ai<.35))r.a=1;else r.e=1}
  }
  const bd=r.b||r.d;
  if(kd==='throw'){if(bd)r.a=1;r.b=r.d=0}
  else if(kd==='corner'){if(r.a||bd||r.e)spLob(p);r.a=r.b=r.d=r.e=0}

function spStop(ev,txt){ev.sp=1;stop(ev,[[txt,'#ffffff',55,'whistle']])}

function outSide(){

function postHit(){
  if(ball.z>BARZ+BARH)return false;
  for(const gx of[PL,PR]){
    if(Math.abs(ball.x-gx)>40&&Math.abs(ball.px-gx)>40)continue;
    for(const py of[GY0,GY1]){
      const ax=ball.px,ay=ball.py,dx=ball.x-ax,dy=ball.y-ay,l2=dx*dx+dy*dy,u=l2?clamp(((gx-ax)*dx+(py-ay)*dy)/l2,0,1):0,
        qx=ax+u*dx,qy=ay+u*dy,ex=qx-gx,ey=qy-py,dd=Math.hypot(ex,ey);
      if(dd>=POSTR)continue;
      let nx,ny;

      ball.vx*=.92;ball.vy*=.92;ball.cn=0;ball.curve=0;ball.lock=0;

function goalLine(){

/* ---------- Champions League: fase de liga (36 clubes, 8 jornadas), playoffs y eliminatorias ----------
   Fase de liga: los 8 primeros pasan directo a octavos, del 9° al 24° juegan playoffs,

const UCL_N=36;
/* fixture por método del círculo: 8 jornadas, cada club juega una vez por jornada */
function uclFixtures(ids){
  const n=ids.length,days=[];
  for(let r=0;r<8;r++){
    const P=[ids[0]];for(let k=0;k<n-1;k++)P.push(ids[1+((k+r)%(n-1))]);
    const day=[];for(let i=0;i<n/2;i++){const a=P[i],b=P[n-1-i];day.push(r%2?{a:b,b:a}:{a,b})}
    days.push(day);
  }
  return days;
}
function uclStart(){
  const me=SEL[0],pool=TEAMS.map((_,i)=>i).filter(i=>i!==me).sort(()=>Math.random()-.5).slice(0,UCL_N-1);
  const ids=[me,...pool].sort(()=>Math.random()-.5);
  const tbl={};ids.forEach(i=>tbl[i]={id:i,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
  CUP={me,ucl:1,league:1,day:0,days:uclFixtures(ids),tbl,rs:[],direct:[],out:false,champ:-1,msg:''};
  uclBracket();
}
const uclMine=()=>CUP.days[CUP.day].find(m=>m.a===CUP.me||m.b===CUP.me);
function uclRec(a,b,ga,gb){
  const A=CUP.tbl[a],B=CUP.tbl[b];A.p++;B.p++;A.gf+=ga;A.ga+=gb;B.gf+=gb;B.ga+=ga;
  if(ga>gb){A.w++;A.pts+=3;B.l++}else if(ga<gb){B.w++;B.pts+=3;A.l++}else{A.d++;B.d++;A.pts++;B.pts++}
}
/* simula los partidos de la jornada actual que no son del jugador */
function uclDay(){
  for(const m of CUP.days[CUP.day]){
    if(m.done||m.a===CUP.me||m.b===CUP.me)continue;
    m.ga=gl(str(m.a),str(m.b));m.gb=gl(str(m.b),str(m.a));m.done=1;uclRec(m.a,m.b,m.ga,m.gb);
  }
}
function uclPlay(){const m=uclMine();SEL=[CUP.me,m.a===CUP.me?m.b:m.a];startMatch(1,true)}
function uclAfter(){
  sfx('win');

  m.ga=mine?s0:s1;m.gb=mine?s1:s0;m.done=1;uclRec(m.a,m.b,m.ga,m.gb);
  CUP.msg=TEAMS[CUP.me].nm+' '+s0+'-'+s1+' '+TEAMS[mine?m.b:m.a].nm;
  uclDay();CUP.day++;

}
function uclStandings(){

}
/* al terminar la liga: 1°-8° directo a octavos, 9°-24° playoffs (9° vs 24°, 10° vs 23°...), resto eliminado */
function uclEnd(){
  const order=uclStandings().map(r=>r.id),me=CUP.me,pos=order.indexOf(me)+1;
  CUP.order=order;CUP.league=0;CUP.direct=order.slice(0,8);
  const po=[];for(let k=8;k<16;k++)po.push({a:order[k],b:order[31-k]});
  CUP.rs.push({n:'PLAYOFFS',ms:po});
  CUP.out=pos>24;
  CUP.msg=TEAMS[me].nm+' terminó '+pos+'° en la liga · '+(pos<=8?'CLASIFICADO DIRECTO A OCTAVOS':pos<=24?'DISPUTA PLAYOFFS':'ELIMINADO');
  if(pos>8&&!CUP.out)cupBracket();else cupAdvance();
}

  if(s0===s1){const[x,y]=mine?pk:[pk[1],pk[0]];m.pa=x;m.pb=y;CUP.msg+=' · PENALES '+(mine?x+'-'+y:y+'-'+x)}
  m.w=m.ga>m.gb?m.a:m.ga<m.gb?m.b:(m.pa>m.pb?m.a:m.b);m.done=1;

function cupAdvance(){
  do{
    const r=CUP.rs[CUP.rs.length-1];
    for(const m of r.ms)if(!m.done)cupSim(m);
    const w=r.ms.map(m=>m.w);
    const inR=CUP.ucl&&r.n==='PLAYOFFS'&&CUP.direct.includes(CUP.me);
    if(!w.includes(CUP.me)&&!inR)CUP.out=true;
    if(w.length===1)CUP.champ=w[0];
    else cupRound(CUP.ucl&&r.n==='PLAYOFFS'?[...w,...CUP.direct].sort(()=>Math.random()-.5):w);
  }while(CUP.champ<0&&(CUP.out||!cupCur()));

}

function jerseySVG(k){
  const Wd=14,Ht=13,g=Array.from({length:Ht},()=>Array(Wd).fill(null)),A=k.a,B=k.b,put=(x,y,c)=>{g[y+1][x+1]=c};
  for(let x=2;x<=9;x++)for(let y=0;y<=10;y++)put(x,y,A);
  put(2,0,null);put(9,0,null);put(5,0,B);put(6,0,B);
  for(let y=1;y<=4;y++){put(1,y,B);put(10,y,B);if(y>=2){put(0,y,B);put(11,y,B)}}
  if(k.st==='band'){for(let x=2;x<=9;x++){put(x,5,B);put(x,6,B)}}
  else if(k.st==='sash'){for(let i=0;i<8;i++){put(2+i,2+i,B);if(3+i<=9)put(3+i,2+i,B)}}
  else if(k.st==='stripes'){for(const x of[3,5,7])for(let y=1;y<=10;y++)put(x,y,B)}
  const o=g.map(r=>r.slice());
  for(let y=0;y<Ht;y++)for(let x=0;x<Wd;x++)if(!g[y][x]){
    const n=[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>{const yy=y+dy,xx=x+dx;return yy>=0&&yy<Ht&&xx>=0&&xx<Wd&&g[yy][xx]});
    if(n)o[y][x]='#161616';
  }
  let r='';for(let y=0;y<Ht;y++)for(let x=0;x<Wd;x++)if(o[y][x])r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${o[y][x]}"/>`;
  return `<svg viewBox="0 0 ${Wd} ${Ht}" shape-rendering="crispEdges">${r}</svg>`;
}

/* Sala online sin Claude: WebRTC con PeerJS. El código de partida es el ID del host. */
function f8Join(name,isHost){
  return new Promise((resolve,reject)=>{
    if(typeof Peer==='undefined'){reject(new Error('sin PeerJS'));return}
    const handlers={},listeners=[],me={id:'',isMe:true,presence:{}};
    let remote=null,conn=null,settled=false,peer=null;
    const notify=()=>listeners.forEach(f=>{try{f()}catch(e){}});
    const fire=(t,m)=>(handlers[t]||[]).forEach(f=>{try{f(m)}catch(e){console.error(e)}});
    const send=o=>{if(conn&&conn.open){try{conn.send(o)}catch(e){}}};
    const done=(ok,err)=>{if(settled)return;settled=true;ok?resolve(room):reject(err)};
    const room={
      on(t,fn){(handlers[t]=handlers[t]||[]).push(fn)},
      onPeers(fn){listeners.push(fn)},
      peers(){return remote?[me,remote]:[me]},
      presence(p){me.presence=p||{};send({k:'p',v:me.presence});return Promise.resolve()},
      emit(t,d){send({k:'e',t,d});return Promise.resolve()},
      leave(){try{peer.destroy()}catch(e){}}
    };
    const attach=c=>{
      conn=c;
      c.on('open',()=>{
        remote={id:c.peer,isMe:false,presence:null};
        c.send({k:'p',v:me.presence});
        notify();done(true);
      });
      c.on('data',msg=>{
        if(!msg||!remote)return;
        if(msg.k==='e'){fire(msg.t,{isMe:false,data:msg.d})}
        else if(msg.k==='p'){
          const q=msg.v&&msg.v.i&&msg.v.i.q,pq=remote.presence&&remote.presence.i&&remote.presence.i.q;
          if(q!=null&&pq!=null&&q<pq)return;
          const was=remote.presence&&remote.presence.role;
          remote.presence=msg.v;
          if(was!==(msg.v&&msg.v.role))notify();
        }
      });
      c.on('close',()=>{conn=null;remote=null;notify()});
      c.on('error',()=>{});
    };
    try{
      if(isHost){
        peer=new Peer(name,{debug:0});
        peer.on('open',()=>done(true));
        peer.on('connection',c=>{if(conn){c.close();return}attach(c)});
        peer.on('error',e=>done(false,e));
      }else{
        peer=new Peer({debug:0});
        peer.on('open',()=>attach(peer.connect(name,{reliable:false})));
        peer.on('error',e=>done(false,e));
        setTimeout(()=>done(false,new Error('timeout')),12000);
      }
    }catch(e){done(false,e)}
  });
}
async function onlApi(){if(ONL.api)return ONL.api;ONL.api={host:n=>f8Join(n,true),join:n=>f8Join(n,false)};return ONL.api}
function onlFail(){ov('<h1>ONLINE</h1><div class="inf">No se pudo conectar. Revisá la conexión a Internet de los dos celulares y que el código sea el correcto. Si el error sigue, probá de nuevo.</div><button class="btn b" onclick="menu()">VOLVER</button>')}

/* host: lee los controles del invitado (J2) */
function onlIn(fire){
  const pr=onlGuestPeer(),i=pr&&pr.presence.i;if(!i)return;
  const n=INP[1];
  if(fire){n.x=+i.x||0;n.y=+i.y||0;n.run=!!i.run;n.sh=!!i.sh;n.bh=i.bh?1:0}

/* host: manda el estado del partido (20 veces por segundo, en binario compacto) */
function onlSend(){
  const rm=ONL.rm;if(!rm)return;
  if(G.frame%60===0){const g=onlGuestPeer();if(!g||g.presence.live!==ONL.mid)onlStart()}
  const pl=P,u=new DataView(new ArrayBuffer(60+21*pl.length));let o=0;
  const U8=v=>u.setUint8(o++,clamp(Math.round(v)||0,0,255)),U16=v=>{u.setUint16(o,clamp(Math.round(v)||0,0,65535));o+=2},I8=v=>u.setInt8(o++,clamp(Math.round(v)||0,-127,127)),U32=v=>{u.setUint32(o,v>>>0);o+=4};
  const K=p=>p?p.t*16+p.i:255,sc=STS.indexOf(G.state);
  U8(sc<0?5:sc);U8(G.score[0]);U8(G.score[1]);U16(G.time);U32(G.frame);U8(G.slow);U8(K(ctl[0]));U8(K(ctl[1]));U8(G.crazy?1:0);U8(G.sc==null?255:G.sc);U8(K(G.scorer));U16(G.frame-(G.celF||0));
  U8(G.cards[0].y);U8(G.cards[0].r);U8(G.cards[1].y);U8(G.cards[1].r);U8(K(G.ev&&G.ev.inj));U8(K(G.fk&&G.fk.taker));U8(K(ball.own));U8(K(ball.last));U8(pl.length);
  U16((ball.x+64)*16);U16((ball.y+64)*16);U16((ball.z||0)*16);I8(ball.vx*8);I8(ball.vy*8);U8(ball.pw?1:0);
  U16((RF.x+64)*16);U16((RF.y+64)*16);I8(RF.dx*60);U16(RF.run);
  U16(ST[0]);U16(ST[1]);U16(POS[0]);U16(POS[1]);U16(PS[0].a);U16(PS[0].ok);U16(PS[1].a);U16(PS[1].ok);
  for(const p of pl){
    U8(K(p));U16((p.x+64)*16);U16((p.y+64)*16);I8(p.dx*60);I8(p.dy*60);U16(p.run);
    U8(p.spin);U8(p.kk);U8(p.gu);U8(p.hf);U8(p.dr);U8(p.dive);U8(p.dD);U8(p.at);U8(p.fa==null?99:p.fa);U8(p.chg);
    U8((p.down?1:0)|(p.ko?2:0)|(p.lunge>0?4:0)|(p.stun>0?8:0)|(p.mvh>0?16:0)|((p.fd||1)<0?32:0)|((p.ad||1)<0?64:0)|((p.dvd||1)<0?128:0));
    U8(p.air==='bicycle'?1:p.air==='volley'?2:p.air?3:0);
  }
  let b='';for(let i=0;i<o;i++)b+=String.fromCharCode(u.getUint8(i));
  rm.emit('s',{b:btoa(b),ev:ONL.evq.filter(e=>G.frame-e[4]<50).map(e=>e.slice(0,4)),c:G.card?[G.card.c,G.card.num,Math.max(0,G.card.until-G.frame)]:0,fl:G.fk?(G.fk.lbl||(G.fk.pen?'PENAL':'TIRO LIBRE')):0}).catch(()=>{});
}
/* invitado: aplica el estado recibido */
function onlApply(d){
  try{
    const t=atob(d.b),a=new Uint8Array(t.length);for(let i=0;i<t.length;i++)a[i]=t.charCodeAt(i);
    const v=new DataView(a.buffer);let o=0;
    const r8=()=>v.getUint8(o++),r16=()=>{const x=v.getUint16(o);o+=2;return x},i8=()=>v.getInt8(o++),r32=()=>{const x=v.getUint32(o);o+=4;return x};
    const M=ONL.map,ob=k=>k===255?null:(M.get(k)||null);
    const st=r8(),s0=r8(),s1=r8(),tm=r16(),fr=r32(),sl=r8(),c0=r8(),c1=r8(),cz=r8(),sc=r8(),scr=r8(),cel=r16(),y0=r8(),r0=r8(),y1=r8(),r1=r8(),inj=r8(),fk=r8(),own=r8(),lst=r8(),n=r8();
    if(ONL.lf!=null&&fr<=ONL.lf)return;ONL.lf=fr;
    const bx=r16()/16-64,by=r16()/16-64,bz=r16()/16,bvx=i8()/8,bvy=i8()/8,bpw=r8();
    const rx=r16()/16-64,ry=r16()/16-64,rdx=i8()/60,rrun=r16();
    ST=[r16(),r16()];POS=[r16(),r16()];PS=[{a:r16(),ok:r16()},{a:r16(),ok:r16()}];
    const np=[];
    for(let q=0;q<n;q++){
      const k=r8(),x=r16()/16-64,y=r16()/16-64,dx=i8()/60,dy=i8()/60,run=r16();
      const spin=r8(),kk=r8(),gu=r8(),hf=r8(),dr=r8(),dive=r8(),dD=r8(),at=r8(),fa=r8(),chg=r8(),fl=r8(),air=r8();
      const p=M.get(k);if(!p)continue;
      if(p.tx==null||Math.abs(p.tx-x)>90||Math.abs(p.ty-y)>90){p.x=x;p.y=y}
      p.tx=x;p.ty=y;p.dx=dx;p.dy=dy;p.run=run;p.spin=spin;p.kk=kk;p.gu=gu;p.hf=hf;p.dr=dr;p.dive=dive;p.dD=dD;p.at=at;p.fa=fa;p.chg=chg;
      p.down=!!(fl&1);p.ko=!!(fl&2);p.lunge=fl&4?1:0;p.stun=fl&8?1:0;p.mvh=fl&16?1:0;p.fd=fl&32?-1:1;p.ad=fl&64?-1:1;p.dvd=fl&128?-1:1;p.air=AIRS[air];p.ox=p.oy=null;

    ball.tx=bx;ball.ty=by;ball.tz=bz;ball.vx=bvx;ball.vy=bvy;ball.pw=!!bpw;ball.ox=ball.oy=ball.oz=null;ball.own=ob(own);ball.last=ob(lst);
    RF.tx=rx;RF.ty=ry;RF.dx=rdx||1;RF.run=rrun;RF.ox=RF.oy=null;if(Math.abs(RF.x-rx)>90||Math.abs(RF.y-ry)>90){RF.x=rx;RF.y=ry}
    G.state=STS[st]||'menu';G.score=[s0,s1];G.time=tm;G.slow=sl;ctl=[ob(c0),ob(c1)];G.crazy=!!cz;G.sc=sc;G.scorer=ob(scr);
    G.cards=[{y:y0,r:r0},{y:y1,r:r1}];G.ev=inj<255?{inj:ob(inj)}:null;
    ONL.sf=fr;ONL.st=performance.now();G.frame=fr;G.celF=fr-cel;
    G.fk=fk<255?{taker:ob(fk),lbl:d.fl||'TIRO LIBRE'}:null;
    G.card=d.c?{c:d.c[0],num:d.c[1],until:fr+d.c[2]}:null;
    for(const e of d.ev||[]){if(e[0]>ONL.eid){ONL.eid=e[0];if(e[1]==='say')_say(e[2],e[3]||'');else if(e[1]==='grito')_gg();else if(e[1]==='sfx')sfx(e[2])}}
    if(G.state==='end'&&!ONL.end){
      ONL.end=true;
      setTimeout(()=>ov('<div class="big">'+ICO.trophy+'</div><h1>FIN DEL PARTIDO</h1><div class="big">'+G.score[0]+' - '+G.score[1]+'</div><div class="inf">'+G.tm[0].nm+' vs '+G.tm[1].nm+'<br>Esperando la revancha del otro celular…</div><button class="btn b" onclick="location.reload()">SALIR</button>'),700);
    }
  }catch(e){}
}
/* invitado: manda sus controles y suaviza el movimiento entre estados */
function guestTick(){
  readKeys();
